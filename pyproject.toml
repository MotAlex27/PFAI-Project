[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cityflow-corridor-control"
version = "0.1.0"
description = "Independent DQN traffic signal control for a CityFlow corridor"
requires-python = ">=3.10"
dependencies = [
    "cityflow>=0.1.0",
    "gymnasium>=0.29",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "torch>=2.1",
]

[tool.setuptools]
py-modules = ["environment"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
